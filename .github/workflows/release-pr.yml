name: Automated Release PR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'documentation/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (auto, patch, minor, major)'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: 'auto'

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release-pr:
    name: Prepare Release PR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine Next Version & Update Manifests
        id: bump
        run: |
          BUMP_MODE="${{ github.event.inputs.bump || 'auto' }}"
          echo "Running release preparation with bump mode: ${BUMP_MODE}..."
          python3 scripts/prepare-release.py --bump "${BUMP_MODE}"

      - name: Create or Update Release Pull Request
        if: steps.bump.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/next
          title: "chore(release): DMZ v${{ steps.bump.outputs.new_version }}"
          commit-message: "chore(release): bump workspace version to ${{ steps.bump.outputs.new_version }}"
          body: |
            ## DMZ Platform Release Preparation: v${{ steps.bump.outputs.new_version }}

            This automated pull request updates workspace manifests and changelogs for release **v${{ steps.bump.outputs.new_version }}**.

            ### Automated Manifest Updates:
            - **Cargo.toml**: Workspace version updated to `${{ steps.bump.outputs.new_version }}`
            - **Cargo.lock**: Lockfile synchronized via `cargo check --workspace`
            - **dmz-core/workspace/airgap_manifest.json**: Offline toolchain version updated to `${{ steps.bump.outputs.new_version }}`
            - **CHANGELOG.md**: Categorized release notes generated from Conventional Commits

            ### How to Publish:
            When ready to publish this release, simply **merge this Pull Request into main**.
            Upon merge, GitHub Actions will automatically tag `v${{ steps.bump.outputs.new_version }}` and trigger the multi-platform binary compilation and release publishing.
          labels: |
            release
            automated
