name: Automated Release PR & Tagging

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (auto, patch, minor, major)'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: 'auto'

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release-pr:
    name: Prepare Release PR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Calculate Next Version & Update Manifests
        id: bump
        run: |
          BUMP_MODE="${{ github.event.inputs.bump || 'auto' }}"
          echo "Running release preparation with bump mode: ${BUMP_MODE}..."
          python3 scripts/prepare-release.py --bump "${BUMP_MODE}"

      - name: Push Release Branch & Create/Update PR
        if: steps.bump.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "[+] Staging synchronized manifests for v${NEW_VERSION}..."
          git checkout -B release/next
          git add Cargo.toml Cargo.lock dmz-core/workspace/airgap_manifest.json CHANGELOG.md
          git commit -m "chore(release): bump workspace version to ${NEW_VERSION}"

          echo "[+] Pushing release/next branch to origin..."
          git push -f origin release/next

          echo "[+] Checking for existing Pull Request..."
          PR_NUMBER=$(gh pr list --head release/next --base main --state open --json number -q '.[0].number' 2>/dev/null || true)
          PR_TITLE="chore(release): DMZ v${NEW_VERSION}"

          cat << EOF | sed 's/^[ ]*//' > pr_description.md
          ## DMZ Platform Release Preparation: v${NEW_VERSION}

          This automated pull request updates workspace manifests and changelogs for release **v${NEW_VERSION}**.

          ### Automated Manifest Updates:
          - **Cargo.toml**: Workspace version updated to \`${NEW_VERSION}\`
          - **Cargo.lock**: Lockfile synchronized via \`cargo check --workspace\`
          - **dmz-core/workspace/airgap_manifest.json**: Offline toolchain version updated to \`${NEW_VERSION}\`
          - **CHANGELOG.md**: Categorized release notes generated from Conventional Commits

          ### How to Publish:
          1. Review and approve this Pull Request.
          2. Merge this Pull Request into \`main\`.
          3. Tag and push the release:
             \`\`\`bash
             git checkout main && git pull origin main
             git tag -a v${NEW_VERSION} -m "DMZ v${NEW_VERSION}: DMZ Platform Release"
             git push origin v${NEW_VERSION}
             \`\`\`
             *(Or dispatch **Actions ➔ Release DMZ Platform ➔ Run workflow**).*
          EOF

          if [ -n "${PR_NUMBER}" ]; then
            echo "Updating existing Pull Request #${PR_NUMBER}..."
            gh pr edit "${PR_NUMBER}" --title "${PR_TITLE}" --body-file pr_description.md
          else
            echo "Creating new Pull Request..."
            gh pr create \
              --base main \
              --head release/next \
              --title "${PR_TITLE}" \
              --body-file pr_description.md \
              --label "release,automated" || {
                echo "::warning::GitHub Actions is not permitted to create pull requests directly via REST API in this repository."
                echo "::notice::Branch 'release/next' was pushed successfully. You can open the PR at https://github.com/${{ github.repository }}/pull/new/release/next or enable 'Allow GitHub Actions to create and approve pull requests' in repository Settings > Actions > General > Workflow permissions."
              }
          fi
