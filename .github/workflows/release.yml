name: Release DMZ Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v1.2.6)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve-tag:
    name: Resolve Release Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve Tag
        id: resolve
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dmz-cli") | .version')
            TAG_NAME="v${CARGO_VERSION}"
          fi
          echo "Resolved release tag: ${TAG_NAME}"
          echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT

  validate-tag:
    name: Validate Git Tag vs Cargo.toml
    needs: [resolve-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Tag Matches Cargo.toml
        run: |
          TARGET_TAG="${{ needs.resolve-tag.outputs.release_tag }}"
          TAG_VERSION="${TARGET_TAG#v}"
          echo "Verifying release tag ($TAG_VERSION)..."
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dmz-cli") | .version')
          echo "Cargo workspace package version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Release Git Tag ($TAG_VERSION) does not match Cargo.toml workspace version ($CARGO_VERSION)!"
            echo "::error::Please ensure [workspace.package].version in Cargo.toml matches the release tag before publishing."
            exit 1
          fi
          echo "Git Tag and Cargo.toml versions are synchronized ($TAG_VERSION)."

  build-platform:
    name: Build & Package (${{ matrix.os }})
    needs: [resolve-tag, validate-tag]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cli_target: x86_64-unknown-linux-musl
          - os: macos-15
            cli_target: aarch64-apple-darwin
          - os: windows-2022
            cli_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cli_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.cli_target }}

      - name: Install Linux Build Dependencies
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Build Release Binaries
        run: |
          cargo build --release --package dmz-cli --target ${{ matrix.cli_target }}
          cargo build --release --package dmz-gui

      - name: Package Linux Artifacts
        if: contains(matrix.os, 'ubuntu')
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.cli_target }}/release/dmz staging/dmz-${{ matrix.cli_target }}
          chmod +x staging/dmz-${{ matrix.cli_target }}

          mkdir -p dist-gui
          cp target/release/dmz-gui dist-gui/dmz-gui
          chmod +x dist-gui/dmz-gui
          tar -czvf staging/DMZ-GUI-Linux.tar.gz -C dist-gui dmz-gui

      - name: Package macOS Artifacts
        if: contains(matrix.os, 'macos')
        shell: bash
        run: |
          mkdir -p staging
          if [ -f "target/${{ matrix.cli_target }}/release/dmz" ]; then
            cp "target/${{ matrix.cli_target }}/release/dmz" staging/dmz-${{ matrix.cli_target }}
          else
            cp target/release/dmz staging/dmz-${{ matrix.cli_target }}
          fi
          chmod +x staging/dmz-${{ matrix.cli_target }}

          mkdir -p DMZ.app/Contents/MacOS DMZ.app/Contents/Resources
          if [ -f "target/${{ matrix.cli_target }}/release/dmz-gui" ]; then
            cp "target/${{ matrix.cli_target }}/release/dmz-gui" DMZ.app/Contents/MacOS/dmz-gui
          else
            cp target/release/dmz-gui DMZ.app/Contents/MacOS/dmz-gui
          fi
          chmod +x DMZ.app/Contents/MacOS/dmz-gui

          mkdir -p icon.iconset
          sips -z 16 16     assets/dmz-icon.png --out icon.iconset/icon_16x16.png || true
          sips -z 32 32     assets/dmz-icon.png --out icon.iconset/icon_32x32.png || true
          sips -z 128 128   assets/dmz-icon.png --out icon.iconset/icon_128x128.png || true
          sips -z 256 256   assets/dmz-icon.png --out icon.iconset/icon_256x256.png || true
          sips -z 512 512   assets/dmz-icon.png --out icon.iconset/icon_512x512.png || true
          iconutil -c icns icon.iconset -o DMZ.app/Contents/Resources/AppIcon.icns || true
          rm -rf icon.iconset

          cat << 'EOF' > DMZ.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>DMZ</string>
              <key>CFBundleDisplayName</key>
              <string>DMZ</string>
              <key>CFBundleIdentifier</key>
              <string>com.dmz.sandbox</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.resolve-tag.outputs.release_tag }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>dmz-gui</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep -s - DMZ.app
          zip -r staging/DMZ-GUI-macOS.zip DMZ.app

      - name: Package Windows Artifacts
        if: contains(matrix.os, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          if (Test-Path "target/${{ matrix.cli_target }}/release/dmz.exe") {
            Copy-Item "target/${{ matrix.cli_target }}/release/dmz.exe" staging/dmz-${{ matrix.cli_target }}.exe
          } else {
            Copy-Item "target/release/dmz.exe" staging/dmz-${{ matrix.cli_target }}.exe
          }

          New-Item -ItemType Directory -Force -Path dist-gui
          if (Test-Path "target/${{ matrix.cli_target }}/release/dmz-gui.exe") {
            Copy-Item "target/${{ matrix.cli_target }}/release/dmz-gui.exe" dist-gui/dmz-gui.exe
          } else {
            Copy-Item "target/release/dmz-gui.exe" dist-gui/dmz-gui.exe
          }
          Compress-Archive -Path dist-gui/dmz-gui.exe -DestinationPath staging/DMZ-GUI-Windows.zip -Force

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: staging/*

  release:
    name: Publish GitHub Release
    needs: [resolve-tag, build-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v6
        with:
          path: final-release-assets
          merge-multiple: true

      - name: Publish Release & Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-tag.outputs.release_tag }}
          files: final-release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
