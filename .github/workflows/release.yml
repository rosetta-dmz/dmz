name: Release DMZ Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Musl Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Release Binary
        run: cargo build --release --package dmz-cli --target ${{ matrix.target }}

      - name: Package CLI Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/dmz.exe dist/dmz-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/dmz dist/dmz-${{ matrix.target }}
            chmod +x dist/dmz-${{ matrix.target }}
          fi

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  build-gui:
    name: Build GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: DMZ-GUI-Linux.tar.gz
          - os: macos-14
            artifact_name: DMZ-GUI-macOS.zip
          - os: windows-latest
            artifact_name: DMZ-GUI-Windows.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUI Binary
        run: cargo build --release --package dmz-gui

      - name: Package macOS App Bundle
        if: contains(matrix.os, 'macos')
        run: |
          mkdir -p DMZ.app/Contents/MacOS DMZ.app/Contents/Resources
          cp target/release/dmz-gui DMZ.app/Contents/MacOS/dmz-gui
          chmod +x DMZ.app/Contents/MacOS/dmz-gui

          mkdir -p icon.iconset
          sips -z 16 16     assets/dmz-icon.png --out icon.iconset/icon_16x16.png || true
          sips -z 32 32     assets/dmz-icon.png --out icon.iconset/icon_32x32.png || true
          sips -z 128 128   assets/dmz-icon.png --out icon.iconset/icon_128x128.png || true
          sips -z 256 256   assets/dmz-icon.png --out icon.iconset/icon_128x128.png || true
          sips -z 512 512   assets/dmz-icon.png --out icon.iconset/icon_512x512.png || true
          iconutil -c icns icon.iconset -o DMZ.app/Contents/Resources/AppIcon.icns || true
          rm -rf icon.iconset

          cat << 'EOF' > DMZ.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>DMZ</string>
              <key>CFBundleDisplayName</key>
              <string>DMZ</string>
              <key>CFBundleIdentifier</key>
              <string>com.dmz.sandbox</string>
              <key>CFBundleVersion</key>
              <string>${{ github.ref_name }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>dmz-gui</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep -s - DMZ.app

          zip -r DMZ-GUI-macOS.zip DMZ.app

      - name: Package Windows GUI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-gui
          Copy-Item target/release/dmz-gui.exe dist-gui/dmz-gui.exe
          Compress-Archive -Path dist-gui/dmz-gui.exe -DestinationPath DMZ-GUI-Windows.zip -Force

      - name: Package Linux GUI
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist-gui
          cp target/release/dmz-gui dist-gui/dmz-gui
          chmod +x dist-gui/dmz-gui
          tar -czvf DMZ-GUI-Linux.tar.gz -C dist-gui dmz-gui

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-release-assets
          merge-multiple: true

      - name: Publish Release & Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: final-release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}