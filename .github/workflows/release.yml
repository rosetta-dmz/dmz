name: Release DMZ Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: dmz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: dmz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: dmz.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --package dmz-cli --target ${{ matrix.target }}

      - name: Package Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/dmz.exe dist/dmz-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/dmz dist/dmz-${{ matrix.target }}
            chmod +x dist/dmz-${{ matrix.target }}
          fi

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}