name: Release DMZ Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v1.2.4)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  tag-release:
    name: Check or Cut Release Tag
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Evaluate Release Tag
        id: check
        run: |
          # 1. Direct Tag Push
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            echo "Triggered directly via git tag: ${TAG_NAME}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Workflow Dispatch
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            echo "Triggered via workflow dispatch: ${TAG_NAME}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. Push to main: Check if workspace version was bumped and lacks a tag
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dmz-cli") | .version')
          TARGET_TAG="v${CARGO_VERSION}"
          echo "Cargo workspace version: ${CARGO_VERSION} (Target tag: ${TARGET_TAG})"

          if git rev-parse "${TARGET_TAG}" >/dev/null 2>&1; then
            echo "Tag ${TARGET_TAG} already exists on remote. No new release needed."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "[+] New release version detected! Creating and pushing tag ${TARGET_TAG}..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TARGET_TAG}" -m "DMZ ${TARGET_TAG}: Automated DMZ Platform Release"
            git push origin "${TARGET_TAG}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "release_tag=${TARGET_TAG}" >> $GITHUB_OUTPUT
          fi

  validate-tag:
    name: Validate Git Tag vs Cargo.toml
    needs: [tag-release]
    if: needs.tag-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Tag Matches Cargo.toml
        run: |
          TARGET_TAG="${{ needs.tag-release.outputs.release_tag }}"
          TAG_VERSION="${TARGET_TAG#v}"
          echo "Verifying release tag ($TAG_VERSION)..."
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dmz-cli") | .version')
          echo "Cargo workspace package version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Release Git Tag ($TAG_VERSION) does not match Cargo.toml workspace version ($CARGO_VERSION)!"
            echo "::error::Please bump [workspace.package].version in Cargo.toml to match the release tag before pushing."
            exit 1
          fi
          echo "Git Tag and Cargo.toml versions are synchronized ($TAG_VERSION)."

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [tag-release, validate-tag]
    if: needs.tag-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Musl Tools
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Release Binary
        run: cargo build --release --package dmz-cli --target ${{ matrix.target }}

      - name: Package CLI Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/dmz.exe dist/dmz-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/dmz dist/dmz-${{ matrix.target }}
            chmod +x dist/dmz-${{ matrix.target }}
          fi

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v5
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  build-gui:
    name: Build GUI (${{ matrix.os }})
    needs: [tag-release, validate-tag]
    if: needs.tag-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: DMZ-GUI-Linux.tar.gz
          - os: macos-latest
            artifact_name: DMZ-GUI-macOS.zip
          - os: windows-latest
            artifact_name: DMZ-GUI-Windows.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI Dependencies
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Build GUI Binary
        run: cargo build --release --package dmz-gui

      - name: Package macOS App Bundle
        if: contains(matrix.os, 'macos')
        run: |
          mkdir -p DMZ.app/Contents/MacOS DMZ.app/Contents/Resources
          cp target/release/dmz-gui DMZ.app/Contents/MacOS/dmz-gui
          chmod +x DMZ.app/Contents/MacOS/dmz-gui

          mkdir -p icon.iconset
          sips -z 16 16     assets/dmz-icon.png --out icon.iconset/icon_16x16.png || true
          sips -z 32 32     assets/dmz-icon.png --out icon.iconset/icon_32x32.png || true
          sips -z 128 128   assets/dmz-icon.png --out icon.iconset/icon_128x128.png || true
          sips -z 256 256   assets/dmz-icon.png --out icon.iconset/icon_256x256.png || true
          sips -z 512 512   assets/dmz-icon.png --out icon.iconset/icon_512x512.png || true
          iconutil -c icns icon.iconset -o DMZ.app/Contents/Resources/AppIcon.icns || true
          rm -rf icon.iconset

          cat << 'EOF' > DMZ.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>DMZ</string>
              <key>CFBundleDisplayName</key>
              <string>DMZ</string>
              <key>CFBundleIdentifier</key>
              <string>com.dmz.sandbox</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.tag-release.outputs.release_tag }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>dmz-gui</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep -s - DMZ.app

          zip -r DMZ-GUI-macOS.zip DMZ.app

      - name: Package Windows GUI
        if: contains(matrix.os, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-gui
          Copy-Item target/release/dmz-gui.exe dist-gui/dmz-gui.exe
          Compress-Archive -Path dist-gui/dmz-gui.exe -DestinationPath DMZ-GUI-Windows.zip -Force

      - name: Package Linux GUI
        if: contains(matrix.os, 'ubuntu')
        shell: bash
        run: |
          mkdir -p dist-gui
          cp target/release/dmz-gui dist-gui/dmz-gui
          chmod +x dist-gui/dmz-gui
          tar -czvf DMZ-GUI-Linux.tar.gz -C dist-gui dmz-gui

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v5
        with:
          name: gui-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: [tag-release, build-cli, build-gui]
    if: needs.tag-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: final-release-assets
          merge-multiple: true

      - name: Publish Release & Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag-release.outputs.release_tag }}
          files: final-release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}