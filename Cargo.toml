[workspace]
resolver = "2"
members = [
    "dmz-core",
    "dmz-sandbox",
    "dmz-supervisor",
    "dmz-cli",
    "dmz-gui",
]

[workspace.package]
version = "1.4.5"
edition = "2021"
authors = ["DMZ Open Source Contributors"]
license = "MIT"

[workspace.dependencies]
# Shared Core Dependencies (Statically Linked)
tempfile = "3.27"
git2 = { version = "0.21", default-features = false, features = ["vendored-openssl"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
nix = { version = "0.31", features = ["process", "mount", "sched", "user"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects"] }
libc = "0.2"
tar = "0.4"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
zstd = { version = "0.14", features = ["zstdmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
which = "8.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
interprocess = "2.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
eframe = { version = "0.37", features = ["persistence"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "charset", "http2", "system-proxy"] }
sha2 = "0.11"
toml = "1.2"
thiserror = "2.0"

# Internal Crate Linkage
dmz-core = { path = "./dmz-core" }
dmz-sandbox = { path = "./dmz-sandbox" }
dmz-supervisor = { path = "./dmz-supervisor" }

[profile.release]
opt-level = 3            # Optimize aggressively for execution throughput and vectorization
lto = true             # Enable full Link-Time Optimization across workspace crates
codegen-units = 1      # Reduce parallel code generation units to maximize LTO
panic = "abort"        # Eliminate stack unwinding landing pads to shrink binary footprint
overflow-checks = true # Mandatory: Prevents silent integer wrap in release mode
strip = "debuginfo"    # Strip DWARF/std debuginfo while keeping symbol tables for panic backtraces
