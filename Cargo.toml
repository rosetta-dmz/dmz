[workspace]
resolver = "2"
members = [
    "dmz-core",
    "dmz-sandbox",
    "dmz-supervisor",
    "dmz-cli",
    "dmz-gui",
]

[workspace.package]
version = "1.2.8"
edition = "2021"
authors = ["DMZ Open Source Contributors"]
license = "MIT"

[workspace.dependencies]
# Shared Core Dependencies (Statically Linked)
tempfile = "3.10"
git2 = { version = "0.21", default-features = false, features = ["vendored-openssl"] }
flate2 = { version = "1.0.35", default-features = false, features = ["rust_backend"] }
nix = { version = "0.31", features = ["process", "mount", "sched", "user"] }
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
libc = "0.2"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
zstd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
which = "8.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
interprocess = "2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
eframe = { version = "0.35", features = ["persistence"] }
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
toml = "0.8"

# Internal Crate Linkage
dmz-core = { path = "./dmz-core" }
dmz-sandbox = { path = "./dmz-sandbox" }
dmz-supervisor = { path = "./dmz-supervisor" }

[profile.release]
opt-level = "z"        # Optimize aggressively for binary size
lto = true             # Enable full Link-Time Optimization across workspace crates
codegen-units = 1      # Reduce parallel code generation units to maximize LTO
panic = "abort"        # Eliminate stack unwinding landing pads to shrink binary footprint
strip = "symbols"      # Automatically strip symbols and debug information from release binaries
