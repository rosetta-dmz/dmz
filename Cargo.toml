[workspace]
resolver = "2"
members = [
    "dmz-core",
    "dmz-sandbox",
    "dmz-supervisor",
    "dmz-cli",
    "dmz-gui",
]

[workspace.package]
version = "1.0.8"
edition = "2021"
authors = ["DMZ Open Source Contributors"]
license = "MIT"

[workspace.dependencies]
# Shared Core Dependencies (Statically Linked)
tempfile = "3.10"
git2 = { version = "0.20", default-features = false, features = ["vendored-openssl"] }
flate2 = { version = "=1.0.35", default-features = false, features = ["zlib-ng"] }
nix = { version = "0.28", features = ["process", "mount", "sched", "user"] }
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }
libc = "0.2"
tar = "0.4"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"

# Internal Crate Linkage
dmz-core = { path = "./dmz-core" }
dmz-sandbox = { path = "./dmz-sandbox" }
dmz-supervisor = { path = "./dmz-supervisor" }

[profile.release]
opt-level = "z"        # Optimize aggressively for binary size
lto = true             # Enable full Link-Time Optimization across workspace crates
codegen-units = 1      # Reduce parallel code generation units to maximize LTO
panic = "abort"        # Eliminate stack unwinding landing pads to shrink binary footprint
strip = "symbols"      # Automatically strip symbols and debug information from release binaries
