[workspace]
resolver = "2"
members = [
    "dmz-core",
    "dmz-sandbox",
    "dmz-supervisor",
    "dmz-cli",
    "dmz-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DMZ Open Source Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared Core Dependencies (Statically Linked)
tempfile = "3.10"
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl"] }
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
tar = "0.4"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"

# Internal Crate Linkage
dmz-core = { path = "./dmz-core" }
dmz-sandbox = { path = "./dmz-sandbox" }
dmz-supervisor = { path = "./dmz-supervisor" }

[profile.release]
opt-level = "z"        # Optimize aggressively for binary size
lto = true             # Enable full Link-Time Optimization across workspace crates
codegen-units = 1      # Reduce parallel code generation units to maximize LTO
panic = "abort"        # Eliminate stack unwinding landing pads to shrink binary footprint
strip = "symbols"      # Automatically strip symbols and debug information from release binaries
